faq:
  title: Kysymyksiä
  description: Tärkeimpiä ja oleellisimpia tietoja.
  items:
    - label: Tietoturvallisuus toimii?
      content: Mikään ei ole täysin varmaa, mutta tuoreimmassa teknologiassa on suurin osa ratkaisuista sisäänrakennettuna.
    - label: Kuinka peruminen tapahtuu?
      content: Viestittelemällä, kaikesta voidaan sopia.
    - label: Minkälainen nettisivu?
      content: Lähes kaikki on avointa lähdekoodia. Tietokantojen sekä sisällön ylläpito, varmistus ja päivitys on työläin osuus.
    - label: Klubi
      content: Jäsenyys, osakkuuksia ja ainutlaatuisia etuja. Lisätietoja sivulla osakeanti.
    - label: Liittyminen
      content: Jos haluat mukaan aurinkoyhteisöön, ota yhteyttä sähköpostilla. Kerro nimesi ja yhteystietosi ja millä summilla haluat sijoittaa eri sarjoihin.
    - label: Saako opastusta?
      content: Auttaminen on tärkeää ja aina kannattaa kysyä, jos on epäselvyyksiä. Kysyvä ei tieltä eksy!
